name: CI

on:
  push:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build with Maven
        run: ./mvnw -B verify

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: achat-jar
          path: target/*.jar
          if-no-files-found: error
